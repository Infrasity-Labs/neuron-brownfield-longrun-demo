name: integration

# Opt-in live run: installs the PINNED Okto Neuron release on a fresh runner, starts an isolated daemon, and runs steps 1 to
# 10 of the neuron arm against a fresh store with a model that YOU provide through repository secrets. It costs model calls.
# It runs only when started by hand (workflow_dispatch) or when a pull request gets the label `run-integration`.
#
# Needed:
#   secret   ANTHROPIC_API_KEY       used by the claude CLI for every role session (--bare reads only this key)
#   secret   DEMO_LLM_API_KEY        the key Neuron uses for ingest and ask
#   variable DEMO_LLM_PROVIDER       default anthropic
#   variable DEMO_LLM_MODEL          default claude-haiku-5-5
#   variable DEMO_LLM_API_BASE       default https://api.anthropic.com
#
# The job fails when a hard check fails (isolation violation, a rule value in a recorded question, a rule value copied into
# a spec, event order, the version pin) or when an executable outcome check fails (--fail-on-outcome). Transcripts, asks.jsonl,
# events.jsonl and the manifest are uploaded whether the job passes or fails. Neuron's own home, which holds the saved
# key, is never uploaded.
#
# Status: written, not yet run. It has never been started on GitHub.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "run id (default: ci-<run number>)"
        required: false
        default: ""
  pull_request:
    types: [labeled]

# Actions are referenced by version tag, not by commit SHA (see validate.yml).
jobs:
  live-run-neuron-arm:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-integration'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      DEMO_LLM_PROVIDER: ${{ vars.DEMO_LLM_PROVIDER || 'anthropic' }}
      DEMO_LLM_MODEL: ${{ vars.DEMO_LLM_MODEL || 'claude-haiku-5-5' }}
      DEMO_LLM_API_BASE: ${{ vars.DEMO_LLM_API_BASE || 'https://api.anthropic.com' }}
      DEMO_LLM_API_KEY_ENV: OKTO_NEURON_LLM_API_KEY
      OKTO_NEURON_LLM_API_KEY: ${{ secrets.DEMO_LLM_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RUN_ID: ${{ inputs.run_id || format('ci-{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.9"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install the pinned claude CLI
        run: |
          version="$(python3 -c 'import json; print(json.load(open("pins.json"))["claude_cli"]["expected_version"])')"
          npm install -g "@anthropic-ai/claude-code@${version}"
          claude --version
      - name: Install the pinned Okto Neuron release into the demo folder (checksum checked)
        run: bash scripts/install_neuron.sh
      - name: Install the app's dependencies (for the executable outcome check only)
        run: cd app && npm ci
      - name: Offline checks first
        run: |
          python3 -m unittest discover -s tests
          python3 scripts/check_all.py
      - name: Run steps 1 to 10 of the neuron arm on a fresh store (step 1 runs scripts/setup_vaults.sh)
        run: python3 run_demo.py --arm neuron --run-id "$RUN_ID" --bare --require-outcome --fail-on-outcome
      - name: Upload transcripts, asks, events and manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neuron-arm-${{ env.RUN_ID }}
          path: |
            runs/neuron/${{ env.RUN_ID }}/
          if-no-files-found: warn
